<div class="quiz-container" [class]="stateClass()">

    <!-- Status / Prompt -->
    <div class="quiz-header">
        <button class="quiz-status-btn" (click)="toggleMode()" title="Switch Quiz Mode">
            @if (quiz.mode() === 'dictation') {
            <app-icon name="headphones" [size]="16" class="mode-icon" />
            <span class="mode-text">Dictation (Type what you hear)</span>
            } @else {
            <app-icon name="languages" [size]="16" class="mode-icon" />
            <span class="mode-text">Translation (Type the meaning)</span>
            <!-- Could show source text here if needed -->
            }
            <app-icon name="chevron-down" [size]="12" class="chevron-icon" />
        </button>

        <div class="quiz-stats">
            <span class="streak-badge" [class.has-streak]="quiz.stats().streak > 1">
                <app-icon name="fire" [size]="14" />
                {{ quiz.stats().streak }}
            </span>
            <span class="score-text">{{ quiz.stats().correct }}/{{ quiz.stats().total }}</span>
        </div>
    </div>

    <!-- Main Interaction Area -->
    <div class="quiz-input-area">
        <div class="input-wrapper" [@shake]="isShake()">
            <input #inputField type="text" [(ngModel)]="inputValue" (keydown.enter)="onSubmit()"
                [placeholder]="quiz.questionState() === 'listening' ? 'Listening...' : 'Type here...'"
                [disabled]="quiz.questionState() === 'listening' || quiz.questionState() === 'success'"
                class="quiz-input" [class.is-success]="quiz.questionState() === 'success'"
                [class.is-error]="quiz.questionState() === 'failed'" autocomplete="off" spellcheck="false" />

            <div class="input-actions">
                @if (quiz.questionState() === 'success') {
                <div class="result-icon success" @fadeIn>
                    <app-icon name="check" [size]="20" />
                </div>
                } @else if (quiz.questionState() === 'failed') {
                <div class="result-icon error" @fadeIn>
                    <app-icon name="x" [size]="20" />
                </div>
                }
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="quiz-controls">
        <button class="btn btn-ghost btn-sm" (click)="onReplay()" [disabled]="quiz.questionState() === 'success'">
            <app-icon name="repeat" [size]="16" />
            <span>Replay</span>
        </button>

        <div class="spacer"></div>

        <button class="btn btn-ghost btn-sm" (click)="onSkip()" [disabled]="quiz.questionState() === 'success'">
            <span>Skip</span>
        </button>

        <button class="btn btn-primary btn-sm" (click)="onSubmit()"
            [disabled]="!inputValue().trim() || quiz.questionState() === 'success' || quiz.questionState() === 'listening'">
            <span>Check</span>
            <app-icon name="arrow-right" [size]="16" />
        </button>
    </div>
</div>
