<div class="controls-row">
    <!-- Left Controls -->
    <div class="controls-left">
        <!-- Play/Pause Button - Desktop only -->
        <button class="control-btn desktop-only" (click)="playPauseClicked.emit($event)"
            [attr.aria-label]="isPlaying() ? (t()('player.pause') || 'Pause') : (t()('player.play') || 'Play')"
            [attr.aria-keyshortcuts]="'k'"
            [title]="isPlaying() ? (t()('player.pause') || 'Pause (k)') : (t()('player.play') || 'Play (k)')">
            <app-icon [name]="isPlaying() ? 'pause' : 'play'" [size]="20" />
        </button>

        <!-- Volume control (Desktop: hover slider) -->
        <div class="volume-control desktop-only"
            (mouseenter)="showVolumeSlider.emit()"
            (mouseleave)="hideVolumeSlider.emit()">
            <button class="control-btn volume-btn" (click)="toggleMute.emit()"
                [attr.aria-label]="t()('player.mute') || 'Mute'"
                [attr.aria-keyshortcuts]="'m'"
                [title]="(t()('player.mute') || 'Mute') + ' (m)'">
                <app-icon [name]="volumeIcon()" [size]="18" />
            </button>
            <div class="volume-slider-container desktop-only" [class.visible]="isVolumeSliderVisible()">
                <div class="volume-slider-track"
                    (mousedown)="onVolumeSliderMouseDown($event)"
                    (keydown)="onVolumeKeyDown($event)"
                    tabindex="0"
                    role="slider"
                    [attr.aria-label]="t()('player.volume') || 'Volume'"
                    [attr.aria-valuenow]="isMuted() ? 0 : volume()"
                    [attr.aria-valuemin]="0"
                    [attr.aria-valuemax]="100"
                    [attr.aria-valuetext]="isMuted() ? (t()('player.muted') || 'Muted') : volume() + '%'"
                    [style.--volume-percent]="volumePercent() + '%'">
                    <div class="volume-slider-fill"></div>
                    <div class="volume-slider-handle"></div>
                </div>
            </div>
        </div>

        <!-- Time Display -->
        <div class="time-display">
            <span class="time-current">{{ currentTime() }}</span>
            <span class="time-separator">/</span>
            <span class="time-total">{{ duration() }}</span>
        </div>
    </div>

    <!-- Right Controls -->
    <div class="controls-right">
        <!-- Unified right controls group -->
        <div class="controls-right-group">
            <!-- Subtitles / CC Toggle - Fullscreen only (c) -->
            @if (isFullscreen()) {
            <button class="control-btn cc-btn" [class.is-active]="subtitlesVisible()"
                [class.is-ai]="isAISubtitle()"
                [attr.aria-pressed]="subtitlesVisible()"
                (click)="toggleSubtitles.emit()"
                [attr.aria-label]="isAISubtitle() ? (t()('subtitle.aiCaptions') || 'AI Captions') : (t()('player.subtitles') || 'Subtitles/closed captions')"
                [attr.aria-keyshortcuts]="'c'"
                [title]="isAISubtitle() ? ((t()('subtitle.aiCaptions') || 'AI Captions') + ' (c)') : ((t()('player.subtitles') || 'Subtitles/closed captions') + ' (c)')">
                <app-icon [name]="isAISubtitle() ? 'subtitles-ai' : 'subtitles'" [size]="18" />
                <span class="cc-indicator" [class.visible]="subtitlesVisible()"></span>
            </button>
            }

            <!-- Dual Subtitles Toggle (Outside) -->
            @if (isCJKLanguage()) {
            <button class="control-btn dual-sub-btn" [class.is-active]="showDualSubtitles()"
                [attr.aria-pressed]="showDualSubtitles()"
                (click)="toggleDualSubs.emit()"
                (contextmenu)="onDualSubContextMenu($event)"
                [attr.aria-label]="t()('subtitle.dualSubs') || 'Dual Subtitles'"
                [attr.aria-keyshortcuts]="'d'"
                [title]="(t()('subtitle.dualSubs') || 'Dual Subtitles') + ' (d)'">
                <app-icon name="languages" [size]="18" />
                <span class="cc-indicator" [class.visible]="showDualSubtitles()"></span>
            </button>
            }

            <!-- Player Settings (YouTube style gear) -->
            <button class="control-btn settings-btn" (click)="openSettings.emit($event)"
                [attr.aria-label]="t()('player.settings') || t()('settings.title') || 'Settings'"
                [title]="t()('player.settings') || t()('settings.title') || 'Settings'">
                <app-icon name="settings" [size]="18" />
            </button>

            <!-- Miniplayer (Desktop & mobile - hidden in fullscreen) -->
            @if (!isFullscreen()) {
            <button class="control-btn" (click)="toggleMiniplayer.emit()"
                [attr.aria-label]="t()('player.miniplayer') || 'Miniplayer'"
                [attr.aria-keyshortcuts]="'i'"
                [title]="(t()('player.miniplayer') || 'Miniplayer') + ' (i)'">
                <app-icon name="miniplayer" [size]="18" />
            </button>
            }

            <!-- Fullscreen -->
            <button class="control-btn" (click)="toggleFullscreen.emit()"
                [attr.aria-label]="t()('player.fullscreen') || (isFullscreen() ? 'Exit fullscreen' : 'Fullscreen')"
                [attr.aria-keyshortcuts]="'f'"
                [title]="t()('player.fullscreen') || (isFullscreen() ? 'Exit fullscreen (f)' : 'Fullscreen (f)')">
                <app-icon [name]="isFullscreen() ? 'fullscreen-exit' : 'fullscreen'" [size]="18" />
            </button>
        </div>
    </div>
</div>
