<div class="controls-row">
    <!-- Left Controls -->
    <div class="controls-left">
        <!-- Play/Pause Button - Desktop only -->
        <button class="control-btn desktop-only" (click)="playPauseClicked.emit($event)"
            [attr.aria-label]="t()('player.playPause') || (isPlaying() ? 'Pause' : 'Play')"
            [title]="t()('player.playPause') || (isPlaying() ? 'Pause (k)' : 'Play (k)')">
            <app-icon [name]="isPlaying() ? 'pause' : 'play'" [size]="20" />
        </button>

        <!-- Volume group - desktop only -->
        <div class="volume-control desktop-only" (mouseenter)="showVolumeSlider.emit()"
            (mouseleave)="hideVolumeSlider.emit()">
            <button class="control-btn" (click)="toggleMute.emit()"
                [attr.aria-label]="t()('player.mute') || 'Mute (m)'"
                [title]="t()('player.mute') || 'Mute (m)'">
                <app-icon [name]="getVolumeIcon()" [size]="18" />
            </button>
            <div class="volume-slider-container" [class.visible]="isVolumeSliderVisible()">
                <div class="volume-slider-track" (mousedown)="onVolumeSliderMouseDown($event)"
                    [style.--volume-percent]="volumePercent() + '%'">
                    <div class="volume-slider-fill"></div>
                    <div class="volume-slider-handle"></div>
                </div>
            </div>
        </div>

        <!-- Time Display -->
        <div class="time-display">
            <span class="time-current">{{ currentTime() }}</span>
            <span class="time-separator">/</span>
            <span class="time-total">{{ duration() }}</span>
        </div>

        <!-- Mute button - mobile only (standalone) -->
        <button class="control-btn mobile-only" (click)="toggleMute.emit()"
            [attr.aria-label]="t()('player.mute') || 'Mute (m)'"
            [title]="t()('player.mute') || 'Mute (m)'">
            <app-icon [name]="getVolumeIcon()" [size]="18" />
        </button>
    </div>

    <!-- Right Controls -->
    <div class="controls-right">
        <!-- Unified right controls group -->
        <div class="controls-right-group">
            <!-- Subtitles / CC Toggle (YouTube style) -->
            <button class="control-btn cc-btn" [class.is-active]="subtitlesVisible()"
                (click)="toggleSubtitles.emit()"
                [attr.aria-label]="t()('player.subtitles') || 'Subtitles/closed captions (c)'"
                [title]="t()('player.subtitles') || 'Subtitles/closed captions (c)'">
                <app-icon name="subtitles" [size]="18" />
                <span class="cc-indicator" [class.visible]="subtitlesVisible()"></span>
            </button>

            <!-- Dual Subtitles Toggle (Outside) -->
            @if (isCJKLanguage()) {
            <button class="control-btn dual-sub-btn" [class.is-active]="showDualSubtitles()"
                (click)="toggleDualSubs.emit()"
                [attr.aria-label]="t()('subtitle.dualSubs') || 'Dual Subtitles'"
                [title]="t()('subtitle.dualSubs') || 'Dual Subtitles'">
                <app-icon name="languages" [size]="18" />
                <span class="cc-indicator" [class.visible]="showDualSubtitles()"></span>
            </button>
            }

            <!-- Playback Speed Pill - Desktop only: shows speed & 1-click opens speed menu -->
            <button class="control-btn speed-btn desktop-only" (click)="speedClick.emit($event)"
                [attr.aria-label]="(t()('player.playbackSpeed') || 'Playback speed') + ': ' + (currentSpeed() === 1 ? (t()('player.normal') || 'Normal') : currentSpeed() + 'x')"
                [title]="(t()('player.playbackSpeed') || 'Playback speed') + ': ' + (currentSpeed() === 1 ? (t()('player.normal') || 'Normal') : currentSpeed() + 'x')">
                <span class="speed-pill-label">{{ currentSpeed() === 1 ? '1x' : currentSpeed() + 'x' }}</span>
            </button>

            <!-- Player Settings (YouTube style gear) -->
            <button class="control-btn settings-btn" (click)="openSettings.emit($event)"
                [attr.aria-label]="t()('player.settings') || t()('settings.title') || 'Settings'"
                [title]="t()('player.settings') || t()('settings.title') || 'Settings'">
                <app-icon name="settings" [size]="18" />
            </button>

            <!-- Fullscreen -->
            <button class="control-btn" (click)="toggleFullscreen.emit()"
                [attr.aria-label]="t()('player.fullscreen') || (isFullscreen() ? 'Exit fullscreen (f)' : 'Fullscreen (f)')"
                [title]="t()('player.fullscreen') || (isFullscreen() ? 'Exit fullscreen (f)' : 'Fullscreen (f)')">
                <app-icon [name]="isFullscreen() ? 'minimize' : 'maximize'" [size]="18" />
            </button>
        </div>
    </div>
</div>
