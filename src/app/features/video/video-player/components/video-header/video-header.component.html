<div class="video-info">
    @if (title() && channel()) {
    <div class="video-text">
        <h2 class="video-title">{{ title() }}</h2>
        <div class="video-meta-row">
            <span class="video-channel" [attr.title]="channel()">{{ channel() }}</span>
            @if (levelInfo(); as lvl) {
            <span class="level-badge" [attr.data-tier]="lvl.tier" (click)="openLevelSheet($event)" role="button" tabindex="0" [attr.title]="lvl.level">
                {{ lvl.level }}
            </span>
            } @else if (isLevelLoading()) {
            <span class="level-badge level-badge--skeleton" [attr.title]="i18n.t('level.evaluating') || 'Evaluating level...'" [attr.aria-label]="i18n.t('level.evaluating') || 'Evaluating level...'">
                <span class="level-skeleton-shimmer"></span>
            </span>
            }
        </div>
    </div>
    <div class="video-actions">
        <button type="button" class="btn-icon btn-header-action" (click)="shareVideo.emit()"
            [attr.aria-label]="i18n.t('player.share') || 'Share video'"
            [title]="i18n.t('player.share') || 'Share video'">
            <app-icon name="share" [size]="15" />
        </button>
        <button type="button" class="btn-icon btn-header-action" (click)="savePlaylist.emit()"
            [attr.aria-label]="i18n.t('playlist.saveToPlaylist') || 'Save to playlist'"
            [title]="i18n.t('playlist.saveToPlaylist') || 'Save to playlist'">
            <app-icon name="list-plus" [size]="15" />
        </button>
        <button type="button" class="btn-icon btn-header-action btn-close-video" (click)="closeVideo.emit()"
            [attr.aria-label]="i18n.t('player.closeVideo') || 'Close'"
            [title]="i18n.t('player.closeVideo') || 'Close'">
            <app-icon name="x" [size]="18" />
        </button>
    </div>
    } @else {
    <!-- Skeleton loading with shimmer effect -->
    <div class="video-text">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-channel"></div>
    </div>
    }
</div>

@if (levelInfo(); as lvl) {
@defer (when showLevelSheet()) {
<app-bottom-sheet
    [isOpen]="showLevelSheet()"
    [title]="i18n.t('level.dialogTitle') || 'Proficiency Level'"
    [showCloseButton]="true"
    maxWidth="460px"
    (closed)="showLevelSheet.set(false)"
>
    <app-video-level-dialog [levelInfo]="lvl" (dismissed)="showLevelSheet.set(false)" />
</app-bottom-sheet>
}
}
