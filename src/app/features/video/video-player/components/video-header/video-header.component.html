<div class="video-info">
    @if (title() && channel()) {
    <div class="video-text">
        <h2 class="video-title" [attr.title]="title()">{{ title() }}</h2>
        <div class="video-meta-row">
            <span class="video-channel" [attr.title]="channel()">{{ channel() }}</span>
            @if (levelInfo(); as lvl) {
            <app-level-badge
                [level]="lvl.level"
                [tier]="lvl.tier"
                size="sm"
                [clickable]="true"
                (clicked)="openLevelSheet($event)"
            />
            } @else if (isLevelLoading()) {
            <app-level-badge
                [loading]="true"
                size="sm"
                [customTitle]="i18n.t('level.evaluating') || 'Evaluating level...'"
            />
            }
        </div>
    </div>
    <div class="video-actions">
        @if (availableTracks().hasAny) {
        <button type="button" class="btn-icon btn-header-action"
            (click)="onSubtitleButtonClick($event)"
            [attr.aria-label]="subtitleButtonTitle()"
            [title]="subtitleButtonTitle()">
            <app-icon [name]="isAIGenerated() ? 'subtitles-ai' : 'subtitles'" [size]="15" />
        </button>
        }
        <button type="button" class="btn-icon btn-header-action" (click)="shareVideo.emit()"
            [attr.aria-label]="i18n.t('player.share') || 'Share video'"
            [title]="i18n.t('player.share') || 'Share video'">
            <app-icon name="share" [size]="15" />
        </button>
        <button type="button" class="btn-icon btn-header-action btn-close-video" (click)="closeVideo.emit()"
            [attr.aria-label]="i18n.t('player.closeVideo') || 'Close'"
            [title]="i18n.t('player.closeVideo') || 'Close'">
            <app-icon name="x" [size]="18" />
        </button>
    </div>
    } @else {
    <!-- Skeleton loading with shimmer effect -->
    <div class="video-text">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-channel"></div>
    </div>
    }
</div>

@if (levelInfo(); as lvl) {
@defer (when showLevelSheet()) {
<app-bottom-sheet
    [isOpen]="showLevelSheet()"
    [title]="i18n.t('level.dialogTitle') || 'Proficiency Level'"
    [showCloseButton]="true"
    maxWidth="460px"
    (closed)="showLevelSheet.set(false)"
>
    <app-video-level-dialog [levelInfo]="lvl" (dismissed)="showLevelSheet.set(false)" />
</app-bottom-sheet>
}
}

@if (showTracksSheet()) {
<app-option-picker
    [options]="trackOptions()"
    [value]="activeTrackValue()"
    [isOpen]="showTracksSheet()"
    [title]="i18n.t('subtitle.tracksTitle') || 'Subtitle Tracks'"
    (selected)="onTrackOptionSelected($event)"
    (closed)="showTracksSheet.set(false)"
/>
}
