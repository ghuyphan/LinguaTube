<div class="onboarding-dialog">
    <!-- Header Section -->
    <div class="header-section">
        <div class="title-group">
            <h2 class="title">{{ i18n.t('onboarding.welcomeTitle') }}</h2>
            <p class="subtitle">{{ i18n.t('onboarding.welcomeSubtitle') }}</p>
        </div>
    </div>

    <!-- Target Language Selection -->
    <div class="section-block">
        <span class="section-label">{{ i18n.t('onboarding.learningLanguageTitle') }}</span>

        <div class="language-grid">
            @for (lang of learningLanguages; track lang.code) {
            <button
                type="button"
                class="language-card"
                [class.selected]="selectedLang() === lang.code"
                (click)="selectLanguage(lang.code)"
            >
                <div class="flag-wrapper">
                    <img [src]="lang.flag" [alt]="lang.name" class="flag" />
                    @if (selectedLang() === lang.code) {
                    <div class="check-badge">
                        <app-icon name="check" [size]="10" />
                    </div>
                    }
                </div>
                <div class="lang-info">
                    <span class="lang-name">{{ lang.name }}</span>
                    <span class="lang-native">{{ lang.nativeName }}</span>
                </div>
            </button>
            }
        </div>
    </div>

    <!-- Primary & Ghost Actions -->
    <div class="action-group">
        <button
            type="button"
            class="btn btn-primary btn-full onboarding-start-btn"
            (click)="startLearning()"
        >
            <span>{{ i18n.t('onboarding.startLearning') }}</span>
            <app-icon name="arrow-right" [size]="18" />
        </button>

        <button
            type="button"
            class="btn btn-ghost btn-full skip-btn"
            (click)="skip()"
        >
            {{ i18n.t('onboarding.skip') }}
        </button>
    </div>
</div>
