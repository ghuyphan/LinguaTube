@if (isOpen()) {
<div class="sheet-overlay" [class.closing]="isClosing()" [style.z-index]="computedZIndex()"
    (click)="onBackdropClick($event)" (touchend)="onBackdropTouch($event)">
    <div class="sheet" #sheetEl [class.closing]="isClosing() && !isDragClosing()" [class.drag-closing]="isDragClosing()"
        [class.dragging]="isDragging()" [class.animated]="hasAnimated()" [class.desktop-modal]="!isMobile"
        [class.square-corners]="squareCorners()" [style.--drag-offset]="dragOffset() + 'px'"
        [style.--max-height]="maxHeight()" [style.--max-width]="maxWidth()" (click)="$event.stopPropagation()" (animationend)="onAnimationEnd($event)"
        (touchstart)="onTouchStart($event)" (touchmove)="onTouchMove($event)" (touchend)="onTouchEnd($event)"
        role="dialog" aria-modal="true" [attr.aria-label]="effectiveAriaLabel()">

        <!-- Drag Handle - visible on mobile -->
        @if (showDragHandle()) {
        <div class="sheet-drag-handle">
            <div class="sheet-drag-indicator"></div>
        </div>
        }

        <!-- Close Button -->
        @if (showCloseButton()) {
        <button class="sheet-close-btn" (click)="close()" type="button" [attr.aria-label]="i18n.t('common.close') || 'Close'">
            <app-icon name="x" [size]="20" />
        </button>
        }

        <!-- Content projection -->
        <div class="sheet-content" #sheetContent>
            <ng-content />
        </div>
    </div>
</div>
}
