<app-bottom-sheet [isOpen]="isOpen()" [allowBackdropClose]="true" [showCloseButton]="true" (closed)="onSheetClosed()">
    <div class="dialog-content">
        <div class="dialog-header">
            <h2>{{ i18n.t('playlist.createPlaylist') }}</h2>
        </div>

        <form (submit)="onSubmit()">
            <!-- Title -->
            <div class="form-group">
                <label for="pl-title">{{ i18n.t('playlist.titleLabel') }}</label>
                <input type="text" id="pl-title" [ngModel]="title()" (ngModelChange)="title.set($event)" name="title"
                    required [placeholder]="i18n.t('playlist.titlePlaceholder')" autocomplete="off">
            </div>

            <!-- Visibility -->
            <div class="form-group">
                <label>{{ i18n.t('playlist.visibilityLabel') }}</label>
                <div class="visibility-options">
                    <button type="button" class="visibility-option" [class.selected]="visibility() === 'private'"
                        (click)="visibility.set('private')">
                        <app-icon name="lock" [size]="18" />
                        <span>{{ i18n.t('playlist.visibility.private') }}</span>
                    </button>
                    <button type="button" class="visibility-option" [class.selected]="visibility() === 'unlisted'"
                        (click)="visibility.set('unlisted')">
                        <app-icon name="link" [size]="18" />
                        <span>{{ i18n.t('playlist.visibility.unlisted') }}</span>
                    </button>
                    <button type="button" class="visibility-option" [class.selected]="visibility() === 'published'"
                        (click)="visibility.set('published')">
                        <app-icon name="globe" [size]="18" />
                        <span>{{ i18n.t('playlist.visibility.public') }}</span>
                    </button>
                </div>
            </div>

            <!-- Language -->
            <div class="form-group">
                <label>{{ i18n.t('playlist.languageLabel') }}</label>
                <div class="language-options">
                    @for (lang of languages; track lang.code) {
                    <button type="button" class="language-option" [class.selected]="language() === lang.code"
                        (click)="language.set(lang.code)">
                        <img [src]="lang.flag" [alt]="lang.name" class="flag-icon">
                    </button>
                    }
                </div>
            </div>

            <!-- Actions -->
            <div class="dialog-actions">
                <button type="button" class="btn btn-secondary" (click)="sheet.close()">
                    {{ i18n.t('playlist.cancel') }}
                </button>
                <button type="submit" class="btn btn-primary" [disabled]="!title() || isSubmitting()">
                    {{ isSubmitting() ? i18n.t('playlist.creating') : i18n.t('playlist.create') }}
                </button>
            </div>
        </form>
    </div>
</app-bottom-sheet>
