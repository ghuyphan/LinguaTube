name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'streaks.pb.js'
      - 'scripts/grammar-chunks/**'
      - 'scripts/translations-builder/**'
      - 'scripts/generate-translations.js'
      - 'scripts/merge-translations.js'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'streaks.pb.js'
      - 'scripts/grammar-chunks/**'
      - 'scripts/translations-builder/**'
      - 'scripts/generate-translations.js'
      - 'scripts/merge-translations.js'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Backend integration tests
        run: |
          npm install --prefix "$RUNNER_TEMP/voca-backend-test" --no-audit --no-fund miniflare@4.20260730.0 @electric-sql/pglite@0.5.17
          VOCA_MINIFLARE_MODULE="$RUNNER_TEMP/voca-backend-test/node_modules/miniflare/dist/src/index.js" \
          VOCA_PGLITE_MODULE="$RUNNER_TEMP/voca-backend-test/node_modules/@electric-sql/pglite/dist/index.js" \
          node --test tests/*.integration.mjs

      - name: Build
        run: npm run build
