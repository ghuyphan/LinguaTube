name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'streaks.pb.js'
      - 'db/**'
      - 'scripts/grammar-chunks/**'
      - 'scripts/translations-builder/**'
      - 'scripts/generate-translations.js'
      - 'scripts/merge-translations.js'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'streaks.pb.js'
      - 'db/**'
      - 'scripts/grammar-chunks/**'
      - 'scripts/translations-builder/**'
      - 'scripts/generate-translations.js'
      - 'scripts/merge-translations.js'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
