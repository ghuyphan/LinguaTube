<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">

  <defs>
    <!-- Full head silhouette clip: smooth oval with apex at y=64 and bottom at y=426 -->
    <clipPath id="head-clip">
      <path d="M 292 222 A 219.5 158 0 0 1 731 222 A 219.5 204 0 0 1 292 222 Z" />
    </clipPath>
    <clipPath id="left-ear-clip">
      <path d="M 328 336 C 319 375, 320 435, 333 484 C 337 496, 351 497, 362 488 C 392 467, 422 442, 446 415 L 430 336 Z" />
    </clipPath>
    <clipPath id="right-ear-clip">
      <path d="M 695 336 C 704 375, 703 435, 690 484 C 686 496, 672 497, 661 488 C 631 467, 601 442, 577 415 L 593 336 Z" />
    </clipPath>
    <linearGradient id="voca-diamond-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Pure Authentic Character with complete curved head (NO rectangular brick) -->
    <g id="fox-character">
      <!-- Left Ear -->
      <g clip-path="url(#left-ear-clip)">
        <rect x="315" y="330" width="140" height="175" fill="#E76136" />
        <path d="M 315 392 L 352 421 L 390 439 L 425 447 L 425 500 L 315 500 Z" fill="#491A23" />
        <path d="M 354 363 C 345 395, 345 430, 352 457 C 353 462, 358 463, 363 459 C 382 444, 400 424, 416 405 C 396 391, 375 377, 354 363 Z" fill="#F7EFDA" />
      </g>
      <!-- Right Ear -->
      <g clip-path="url(#right-ear-clip)">
        <rect x="570" y="330" width="140" height="175" fill="#E76136" />
        <path d="M 708 392 L 671 421 L 633 439 L 598 447 L 598 500 L 708 500 Z" fill="#491A23" />
        <path d="M 669 363 C 678 395, 678 430, 671 457 C 670 462, 665 463, 660 459 C 641 444, 623 424, 607 405 C 627 391, 648 377, 669 363 Z" fill="#F7EFDA" />
      </g>
      <!-- Fox Head Base & Cream Chin (Pure smooth oval) -->
      <g clip-path="url(#head-clip)">
        <rect x="280" y="60" width="465" height="380" fill="#E76136" />
        <!-- Cream Chin: fills smoothly to the apex of head-clip -->
        <path d="M 280 60 L 745 60 L 745 190 C 705 212, 668 223, 633 223 C 602 223, 578 209, 558 209 C 542 209, 528 218, 511.5 219 C 495 218, 481 209, 465 209 C 445 209, 421 223, 390 223 C 355 223, 318 212, 280 190 Z" fill="#F7EFDA" />
      </g>
      <!-- Pink Blush Cheeks -->
      <ellipse cx="405" cy="190.5" rx="27" ry="18" fill="#F49C98" />
      <ellipse cx="618" cy="190.5" rx="27" ry="18" fill="#F49C98" />
      <!-- Eyes with Gaze Catchlights -->
      <circle cx="441" cy="242" r="14.5" fill="#4A1922" />
      <circle cx="582" cy="242" r="14.5" fill="#4A1922" />
      <circle cx="438" cy="245" r="4.5" fill="#FFFFFF" />
      <circle cx="579" cy="245" r="4.5" fill="#FFFFFF" />
      <!-- Upside-down Nose & Mouth Stem -->
      <g fill="#491A23">
        <rect x="508.5" y="179" width="6" height="22" rx="3" />
        <path d="M 511.5 195 C 516 195, 529 204, 529.5 212 C 530 217.5, 522 219.5, 511.5 219.5 C 501 219.5, 493 217.5, 493.5 212 C 494 204, 507 195, 511.5 195 Z" />
      </g>
    </g>
  </defs>

  <clipPath id="squircle-clip">
    <rect width="1024" height="1024" rx="225" ry="225" />
  </clipPath>
  <g clip-path="url(#squircle-clip)">
    <rect width="1024" height="1024" fill="url(#voca-diamond-sky)" />
    
  <g transform="translate(512, 480) rotate(8 512 480) scale(1.4) translate(-512, -282)">
    <use href="#fox-character" />
  </g>

  </g>
</svg>